<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>할 말이 있대...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261025-ending-shiver-1"></head>
<body><main class="app">
<section id="creator" class="panel hidden">
  <div class="eyebrow">GAME MAKER</div><h1>게임 만들기</h1><p class="muted">설정하고 링크를 친구에게 보내세요.</p>
  <label>게임 제목<input id="titleInput" maxlength="60" value="치이카와가 할 말이 있대..."></label>
  <fieldset><legend>100% 달성 시 엔딩</legend>
    <label class="choice"><input type="radio" name="ending" value="escape" checked> 도망가기</label>
    <label class="choice"><input type="radio" name="ending" value="message"> 하고 싶은 말 하기</label>
  </fieldset>
  <label id="messageWrap" class="hidden">마지막에 보여줄 말<textarea id="messageInput" maxlength="300" placeholder="하고 싶은 말을 입력하세요."></textarea></label>
  <label>난이도<select id="difficulty"><option value="easy">쉬움 (초당 6% 감소)</option><option value="normal" selected>보통 (초당 8% 감소)</option><option value="hard">어려움 (초당 10% 감소)</option></select></label>
  <label class="choice"><input type="checkbox" id="panic"> 막판 발악 모드 (70%부터 감소 2배)</label>
  <button id="makeLink" class="primary">게임 링크 만들기</button>
  <div id="linkArea" class="hidden"><label>공유할 링크<input id="shareLink" readonly></label><button id="copyLink">링크 복사</button><button id="previewLink">플레이어 화면 미리보기</button></div>
  <p id="createError" class="error" role="alert"></p>
</section>
<section id="game" class="panel hidden">
  <button id="backToCreator" class="preview-back hidden" type="button">← 설정 화면으로 돌아가기</button>
  <div class="eyebrow">A LITTLE COURAGE</div><h1 id="gameTitle">할 말이 있대...</h1>
  <div class="character" aria-label="치이카와 캐릭터">
    <div class="speech-row">
      <div class="speech-bubble" role="status">
        <span id="speech" class="speech" aria-live="polite">우...</span>
      </div>
    </div>
    <div id="characterMotion" class="character-image-wrap">
      <img id="stageImage" class="hidden" alt="치이카와의 표정" decoding="async">
      <img id="stageImageNext" class="hidden" alt="치이카와의 표정" decoding="async">
    </div>
  </div>
  <p id="stageLabel" class="stage-caption">발그레...</p>
  <div class="meterhead"><span>응원도</span><strong id="percent">0%</strong></div>
  <div class="meter" role="progressbar" aria-label="응원도 게이지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><div id="bar"></div></div>
  <button id="tap" class="primary">♡ 꾹꾹... 응원하기!</button>
  <div id="endingBox" class="ending hidden" aria-live="polite"><h2 id="endingTitle"></h2><p id="endingText"></p><p id="endingQuote" class="hidden">"왜 애를 울려!"</p><button id="retry">다시 하기</button></div>
  <p class="muted small">버튼을 빠르게 눌러 100%를 채워주세요.</p>
</section></main><script src="script.js?v=20261025-ending-shiver-1"></script></body></html>
